<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="home.css">

    <title>ROOKIE</title>
</head>

<body>

    <!-- ================= HEADER ================= -->

    <header>

        <!-- NAVBAR -->
        <div class="nav-bar">

            <div class="logo">
                <img src="pictures/rookie.png" alt="logo">
            </div>

            <div class="nav-active">
                <a href="home.html">Home</a>
                <a href="menu.html">Menu</a>
                <a href="order.html">Order</a>
                <a href="contact.html">Contact</a>
            </div>

            <div class="button-signin">
                <button>Sign In</button>
            </div>

        </div>


        <!-- SLIDE / HERO -->
        <div class="slide">

            <img src="pictures/slide1.png" alt="slide">

            <div class="button-order">
                <button>Order Now</button>
            </div>

        </div>

    </header>


    <!-- ================= MAIN ================= -->

    <main>

        <!-- STORY -->

        <section class="story">

            <div class="story-images">

                <img src="pictures/story1.jpg" alt="story">
                <img src="pictures/story2.jpg" alt="story">
                <img src="pictures/story3.jpg" alt="story">

            </div>

            <div class="story-text">

                <h1>ROOKIE</h1>

                <h2>
                    Bring the sweetness to you
                </h2>

            </div>

        </section>


        <!-- MENU CATEGORY -->

        <section class="menu-section">

            <div class="categories">

                <button class="category-button">

                    <div class="category-icon">
                        <img src="pictures/cookie.png" alt="cookie">
                    </div>

                    <span>COOKIE</span>

                </button>


                <button class="category-button">

                    <div class="category-icon">
                        <img src="pictures/cake.png" alt="cake">
                    </div>

                    <span>CAKES</span>

                </button>


                <button class="category-button">

                    <div class="category-icon">
                        <img src="pictures/bread.png" alt="bread">
                    </div>

                    <span>BREAD</span>

                </button>

            </div>

        </section>


        <!-- PRODUCTS -->

        <section class="products">

            <div class="product-card red">

                <h3>RED VELVET</h3>

                <img src="pictures/product1.png" alt="product1">

                <p>$2.99</p>

            </div>


            <div class="product-card green">

                <h3>MATCHA</h3>

                <img src="pictures/product2.png" alt="product2">

                <p>$3.99</p>

            </div>


            <div class="product-card brown">

                <h3>BROWN CHOCO</h3>

                <img src="pictures/product3.png" alt="product3">

                <p>$2.99</p>

            </div>

        </section>


        <!-- SLIDER -->

        <section class="slider">

            <span class="arrow left">
                <img src="pictures/left-arrow.png" alt="left arrow">
            </span>

            <div class="progress-bar">
                <div class="progress"></div>
            </div>

            <span class="arrow right">
                <img src="pictures/right-arrow.png" alt="right arrow">
            </span>

        </section>


        <!-- JOIN -->

        <section class="join-content">

            <div class="join-image">
                <img src="pictures/story1.jpg" alt="join">
            </div>

            <div class="join-text">

                <h1>JOIN US</h1>

                <p>
                    Sign up for our newsletter to receive
                    the latest news and updates from our team.
                </p>

                <div class="join-button">
                    <button>REGISTER HERE</button>
                </div>

            </div>

        </section>

    </main>


    <!-- ================= FOOTER ================= -->

    <footer class="footer">

        <div class="footer-content">

            <div class="footer-logo">
                <img src="pictures/rookie.png" alt="logo">
            </div>


            <div class="footer-links">

                <a href="home.html">Home</a>
                <a href="menu.html">Menu</a>
                <a href="order.html">Order</a>
                <a href="contact.html">Contact</a>

            </div>


            <div class="footer-socials">

                <a href="#">
                    <img src="pictures/facebook.png" alt="facebook">
                </a>

                <a href="#">
                    <img src="pictures/instagram.png" alt="instagram">
                </a>

            </div>

        </div>

    </footer>

</body>

</html>
